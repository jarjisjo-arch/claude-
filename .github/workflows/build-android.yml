name: Build Android APK

on:
  push:
    branches: [claude/build-new-app-2pkXO, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: medication-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"

      - name: Install npm dependencies
        working-directory: medication-app
        run: npm ci

      - name: Write .env file
        working-directory: medication-app
        run: echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" > .env

      - name: Build APK
        working-directory: medication-app/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee /tmp/gradle-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post error as PR comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os

          try:
              with open('/tmp/gradle-output.txt') as f:
                  lines = f.readlines()
              keywords = ['error:', 'FAILED', 'What went wrong', 'Execution failed', '^e: ']
              errors = [l for l in lines if any(k in l for k in keywords)]
              body = ''.join(errors[:80]) if errors else ''.join(lines[-60:])
          except Exception as e:
              body = f'Could not read build log: {e}'

          comment = f"### Build #{os.environ['RUN_NUMBER']} failed\n```\n{body[:3000]}\n```"
          data = json.dumps({'body': comment}).encode()
          repo = os.environ['REPO']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/1/comments',
              data=data,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
              }
          )
          try:
              urllib.request.urlopen(req)
              print('Comment posted successfully')
          except Exception as e:
              print(f'Failed to post comment: {e}')
          PYEOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pregna-ai
          path: medication-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
