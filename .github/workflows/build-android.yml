name: Build Android AAB

on:
  push:
    branches: [claude/build-new-app-2pkXO, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: medication-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Install npm dependencies
        working-directory: medication-app
        run: npm ci

      - name: Write .env file
        working-directory: medication-app
        run: echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" > .env

      - name: Decode keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set. Please add it in GitHub repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > medication-app/android/app/keystore.jks
          if [ ! -s medication-app/android/app/keystore.jks ]; then
            echo "ERROR: Decoded keystore file is empty. KEYSTORE_BASE64 may be corrupted."
            exit 1
          fi
          echo "Keystore decoded successfully ($(wc -c < medication-app/android/app/keystore.jks) bytes)"

      - name: Build AAB + APK
        working-directory: medication-app/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/medication-app/android/app/keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew bundleRelease assembleRelease 2>&1 | tee /tmp/gradle-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post error as PR comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, os

          import pathlib
          log = pathlib.Path('/tmp/gradle-output.txt')
          if log.exists():
              lines = log.read_text().splitlines(keepends=True)
              keywords = ['error:', 'FAILED', 'What went wrong', 'Execution failed', '^e: ']
              errors = [l for l in lines if any(k in l for k in keywords)]
              body = ''.join(errors[:80]) if errors else ''.join(lines[-60:])
          else:
              body = 'Build failed before Gradle ran (likely a missing secret or setup step). Check the Actions log for details.'

          comment = f"### Build #{os.environ['RUN_NUMBER']} failed\n```\n{body[:3000]}\n```"
          data = json.dumps({'body': comment}).encode()
          repo = os.environ['REPO']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/1/comments',
              data=data,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Content-Type': 'application/json',
              }
          )
          try:
              urllib.request.urlopen(req)
              print('Comment posted successfully')
          except Exception as e:
              print(f'Failed to post comment: {e}')
          PYEOF

      - name: Check 16 KB page size alignment
        run: |
          python3 - <<'PYEOF'
          import zipfile, struct, os

          aab_path = "medication-app/android/app/build/outputs/bundle/release/app-release.aab"
          failed = []

          # Only 64-bit ABI libs must be 16 KB-aligned (arm64-v8a, x86_64).
          # 32-bit (armeabi-v7a, x86) always run with 4 KB pages — skip them.
          ARCHS_64 = {'arm64-v8a', 'x86_64'}

          with zipfile.ZipFile(aab_path) as aab:
              for entry in aab.namelist():
                  if not entry.endswith('.so'):
                      continue
                  # path: base/lib/<abi>/libfoo.so
                  parts = entry.split('/')
                  if len(parts) < 3 or parts[-2] not in ARCHS_64:
                      continue
                  data = aab.read(entry)
                  if len(data) < 64 or data[:4] != b'\x7fELF':
                      continue
                  ei_class = data[4]
                  if ei_class == 1:
                      e_phoff = struct.unpack_from('<I', data, 28)[0]
                      e_phentsize = struct.unpack_from('<H', data, 42)[0]
                      e_phnum = struct.unpack_from('<H', data, 44)[0]
                  else:
                      e_phoff = struct.unpack_from('<Q', data, 32)[0]
                      e_phentsize = struct.unpack_from('<H', data, 54)[0]
                      e_phnum = struct.unpack_from('<H', data, 56)[0]
                  for i in range(e_phnum):
                      off = e_phoff + i * e_phentsize
                      p_type = struct.unpack_from('<I', data, off)[0]
                      p_align = struct.unpack_from('<Q', data, off + 48)[0] if ei_class == 2 else struct.unpack_from('<I', data, off + 28)[0]
                      if p_type == 1 and p_align < 16384:
                          failed.append(f"{entry} (align={p_align})")
                          break

          if failed:
              print("FAILING 16 KB CHECK (64-bit libs):")
              for f in failed: print(" ", f)
              raise SystemExit(1)
          else:
              print("All 64-bit .so files pass 16 KB alignment check")
          PYEOF

      - name: Export signing certificate
        run: |
          keytool -export -rfc \
            -alias "${{ secrets.KEYSTORE_KEY_ALIAS }}" \
            -file certificate.pem \
            -keystore medication-app/android/app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_STORE_PASSWORD }}"
          echo "=== KEYSTORE CERTIFICATE FINGERPRINT (SHA-256) ==="
          keytool -printcert -file certificate.pem | grep "SHA256:"
          echo "=== APK SIGNING FINGERPRINT ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs \
            medication-app/android/app/build/outputs/apk/release/app-release.apk \
            | grep "SHA-256"

      - name: Upload signing certificate
        uses: actions/upload-artifact@v4
        with:
          name: signing-certificate
          path: certificate.pem
          retention-days: 7

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: pregna-ai-aab
          path: medication-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK (device testing)
        uses: actions/upload-artifact@v4
        with:
          name: pregna-ai-apk
          path: medication-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
