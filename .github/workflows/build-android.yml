name: Build Android APK

on:
  push:
    branches: [claude/build-new-app-2pkXO, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: medication-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;30.0.14904198"

      - name: Install npm dependencies
        working-directory: medication-app
        run: npm ci

      - name: Write .env file
        working-directory: medication-app
        run: echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" > .env

      - name: Build APK
        working-directory: medication-app/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee /tmp/gradle-output.txt; exit ${PIPESTATUS[0]}

      - name: Show errors on failure
        if: failure()
        run: grep -E "^e: |error:|FAILED|What went wrong" /tmp/gradle-output.txt | head -80 || cat /tmp/gradle-output.txt | tail -60

      - name: Post error as PR comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              const full = fs.readFileSync('/tmp/gradle-output.txt', 'utf8');
              const lines = full.split('\n');
              const errors = lines.filter(l => /^e: |error:|FAILED|What went wrong|Execution failed/.test(l));
              log = errors.length > 0 ? errors.slice(0, 80).join('\n') : lines.slice(-60).join('\n');
            } catch(e) {
              log = 'Could not read build log: ' + e.message;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `### Build #${{ github.run_number }} failed\n\`\`\`\n${log}\n\`\`\``
            });

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pregna-ai
          path: medication-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
